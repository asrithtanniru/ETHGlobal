<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f3ef">
<title>Kin · Offline</title>
<style>
  :root { --paper: #f4f3ef; --ink: #0e0d0b; --ink-2: #5e5d59; --line: #dcdad5; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100svh; display: grid; place-items: center; background: var(--paper); color: var(--ink);
    font: 16px/1.5 "Inter Variable", "Inter", ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  main { width: min(440px, 100%); display: grid; gap: 20px; }
  svg { width: 28px; height: 28px; }
  h1 { margin: 0; font-size: 28px; font-weight: 400; letter-spacing: -0.01em; }
  p { margin: 0; color: var(--ink-2); }
  button {
    justify-self: start; height: 40px; padding: 0 16px; border: 0; background: #141414; color: var(--paper);
    font: inherit; font-size: 14px; cursor: pointer;
  }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 31 31" aria-hidden="true"><path fill-rule="evenodd" d="M0 0h31v31H0zM9.5 9.5v12h12v-12z" fill="currentColor"/></svg>
  <h1>You're offline</h1>
  <p>Kin needs a connection to read your vault and send payments.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
